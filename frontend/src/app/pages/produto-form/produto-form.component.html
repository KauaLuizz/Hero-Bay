<main class="container pagina duas-colunas">
  <div class="coluna">
    <h1 class="titulo">Cadastro de produto.</h1>
    <p class="texto-apoio">Os dados aparecem na vitrine da loja assim que você salva.</p>
  </div>

  <form class="formulario">
    @if (produtoId) {
      <div class="campo">
        <label for="id">ID</label>
        <input id="id" name="id" type="text" [ngModel]="produto.id" disabled>
      </div>
    }

    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" placeholder="Ex.: Teclado mecânico" [(ngModel)]="produto.nome">
    </div>

    <div class="campo">
      <label for="preco">Preço (R$)</label>
      <input id="preco" name="preco" type="number" min="0" step="0.01" [(ngModel)]="produto.preco">
    </div>

    <div class="campo">
      <label for="estoque">Estoque</label>
      <input id="estoque" name="estoque" type="number" min="0" step="1" [(ngModel)]="produto.estoque">
    </div>

    <div class="campo">
      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" [(ngModel)]="produto.categoria">
        <option value="placas de vídeo">placas de vídeo</option>
        <option value="teclados">teclados</option>
        <option value="mouses">mouses</option>
        <option value="áudio">áudio</option>
        <option value="refrigeração">refrigeração</option>
      </select>
    </div>

    <div class="campo">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" rows="3" [(ngModel)]="produto.descricao"></textarea>
    </div>

    <div class="campo">
      <label for="imagem">Link da imagem</label>
      <input id="imagem" name="imagem" type="text" placeholder="https://..." [(ngModel)]="produto.imagem">
      @if (produto.imagem) {
        <img class="previa" [src]="produto.imagem" alt="Prévia da imagem">
      }
    </div>

    <button class="botao" type="button" (click)="salvar()">Salvar</button>

    <p class="depois"><a class="link" routerLink="/admin">Voltar ao painel</a></p>
  </form>
</main>
